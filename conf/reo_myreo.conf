# =====================================================================================================
# Configuration de la chaine REO MYREO (LUD_MYREO_ORCHESTRATION_DATA_TO_SV et son job enfant
# LUD_MYREO_REO_RD_TO_SV), lue par MainDriverMyReo. Un fichier par driver : la chaine AJUST a le sien,
# reo_ajust.conf.
#
# Deposer ce fichier sur HDFS et le passer en 2e argument du driver :
#   MainDriverMyReo <env> hdfs:///.../reo_myreo.conf         env = dev | int | hom | prd
#   bin/run_reo.sh myreo <env> hdfs:///.../reo_myreo.conf
#
# Chemins : racine par environnement (contextes Talend) + chemin relatif par table. Une table peut
# surcharger son chemin pour un environnement : dfin.bsy.<TABLE>.path_input.<env> / output_path.<env>.
# Les racines et le referentiel REF_DATA_TYPE_SV figurent aussi dans reo_ajust.conf : reporter tout
# changement dans les deux fichiers.
# =====================================================================================================

dfin.bsy.reo {

  # --- Interrupteurs d'etapes (sous-jobs) : true par defaut -----------------------------------------
  myreo_list_files_trt = true   # tHDFSList_1 / tHDFSList_2 / tHDFSOutput_2 (liste des fichiers candidats)
  myreo_rd_to_sv_trt   = true   # LUD_MYREO_REO_RD_TO_SV (appele par tRunJob_1)
  myreo_ref_update_trt = true   # tMap_2 / tHDFSOutput_1 (historique des fichiers lus)

  # Historique des fichiers lus absent : EMPTY = historique vide (tous les fichiers du depot sont nouveaux,
  #                                              historique cree en fin de run)
  #                                      FAIL  = erreur, comme Talend (getFileStatus en echec)
  myreo_on_missing_ref = "EMPTY"

  # Alertes qualite non bloquantes (historique en double, montants non numeriques, lignes CRLF)
  dq_checks = true

  # Parametres Spark SQL par environnement. Les jobs Talend MYREO etaient des jobs Standard, sans Spark :
  # valeurs dimensionnees pour un fichier d'extraction par run (bin/run_reo.sh myreo : parallelisme 4).
  spark_sql_conf {
    dev { "spark.sql.shuffle.partitions" = 4 }
    int { "spark.sql.shuffle.partitions" = 4 }
    hom { "spark.sql.shuffle.partitions" = 4 }
    prd { "spark.sql.shuffle.partitions" = 4 }
  }

  # --- Racines par environnement (contextes Talend des deux jobs MYREO) ------------------------------
  roots {
    dev {
      raw    = "/dev/raw/bsy_a2918/basycout"                                 # base de IPF_RD_ROOT_PATH_IN
      sv_reo = "/dev/srv/bsy_a2918/srv_bsy_a2918_basycout/sv_reo"            # BSY_ROOT_SV_REO
      erk_sv = "/dev/srv/bsy_a2918/srv_bsy_a2918_basycout/erk_a2832"         # ERK_SV_ROOT_PATH_OUT
      wp_reo = "/dev/app/bsy_a2918/wp_reo"                                   # BSY_WP_ROOT_PATH_OUT
    }
    int {
      raw    = "/int/raw/bsy_a2918/basycout"
      sv_reo = "/int/srv/bsy_a2918/srv_bsy_a2918_basycout/sv_reo"
      erk_sv = "/int/srv/bsy_a2918/srv_bsy_a2918_basycout/erk_a2832"
      wp_reo = "/int/app/bsy_a2918/wp_reo"
    }
    hom {
      raw    = "/fhml/raw/bsy_a2918/basycout"
      sv_reo = "/fhml/srv/bsy_a2918/srv_bsy_a2918_basycout/sv_reo"
      erk_sv = "/fhml/srv/bsy_a2918/srv_bsy_a2918_basycout/erk_a2832"
      wp_reo = "/fhml/app/bsy_a2918/wp_reo"
    }
    prd {
      raw    = "/prd/raw/bsy_a2918/basycout"
      sv_reo = "/prd/srv/bsy_a2918/srv_bsy_a2918_basycout/sv_reo"
      erk_sv = "/prd/srv/bsy_a2918/srv_bsy_a2918_basycout/erk_a2832"
      wp_reo = "/prd/app/bsy_a2918/wp_reo"
    }
    # Recette parallele (exemple) : sorties dans un bac a sable, depot MyREO et referentiel lus sur HOM.
    # rec {
    #   raw = ${dfin.bsy.reo.roots.hom.raw}, erk_sv = ${dfin.bsy.reo.roots.hom.erk_sv}
    #   wp_reo = "/fhml/app/bsy_a2918/recette_reo/wp_reo", sv_reo = "/fhml/app/bsy_a2918/recette_reo/sv_reo"
    # }
  }

  # --- Racines que la chaine ne doit jamais ecraser : referentiel ERK SV et depot MyREO (lecture seule) -
  protected_roots {
    dev = [${dfin.bsy.reo.roots.dev.erk_sv}, ${dfin.bsy.reo.roots.dev.raw}"/ajust/AJU_RES_CLE"]
    int = [${dfin.bsy.reo.roots.int.erk_sv}, ${dfin.bsy.reo.roots.int.raw}"/ajust/AJU_RES_CLE"]
    hom = [${dfin.bsy.reo.roots.hom.erk_sv}, ${dfin.bsy.reo.roots.hom.raw}"/ajust/AJU_RES_CLE"]
    prd = [${dfin.bsy.reo.roots.prd.erk_sv}, ${dfin.bsy.reo.roots.prd.raw}"/ajust/AJU_RES_CLE"]
    # rec = ${dfin.bsy.reo.protected_roots.hom}   # recette : depot et referentiel lus sur HOM
  }
}

dfin.bsy {

  # ===================================================================================================
  # Referentiel des types de donnees ERK SV : tHDFSInput_2 "data_type" du job enfant (aussi lu par AJUST)
  # ===================================================================================================
  REF_DATA_TYPE_SV { input_root = "erk_sv", input_rel = "/ajust/dtype", input_delimiter = ";" }

  # ===================================================================================================
  # Fichiers MYREO : UTF-8, separateur ';'
  # ===================================================================================================
  MYREO_RD_FILES {                                 # IPF_RD_ROOT_PATH_IN + rep_file (lecture seule, protege)
    input_root = "raw", input_rel = "/ajust/AJU_RES_CLE"
    dir_masks  = ["*"]                             # tHDFSList_1 : dossiers directs, tri par nom
    file_masks = ["*.RECU", "*.PRET"]              # tHDFSList_2 : masque par masque, tri par nom, casse respectee
    input_delimiter = ";", input_header = true     # tHDFSInput_1 du job enfant (HEADER = 1)
  }
  MYREO_NEW_FILES {                                # REP_PATH_NEW : "filePath;parentPath", remplace a chaque run
    input_root  = "wp_reo", input_rel  = "/params/my_reo/myreo_path_new_files.csv"
    output_root = "wp_reo", output_rel = "/params/my_reo/myreo_path_new_files.csv"
    input_delimiter = ";"
  }
  MYREO_REF_FILES {                                # REP_PATH_REF : "parentPath;filePath;1", complete a chaque run
    input_root  = "wp_reo", input_rel  = "/params/my_reo/myreo_path_ref_files.csv"
    output_root = "wp_reo", output_rel = "/params/my_reo/myreo_path_ref_files.csv"
    input_delimiter = ";"
  }
  MYREO_SV {                                       # BSY_ROOT_SV_REO + AJU_REO_OUT : fichier unique, UTF-8
    output_root = "sv_reo", output_rel = "/my_reo/Extract_Ajus_Outil_REO_pour_BSY_REO.csv"
    output_delimiter = ";"
  }
}
