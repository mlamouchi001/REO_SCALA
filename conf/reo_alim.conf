# =====================================================================================================
# Configuration de la chaine REO COVID (LUD_FLOW_AJUSTEMENT_REO_COVID et ses 19 jobs enfants), lue par
# MainDriverReo. Un fichier par driver : les chaines AJUST et MYREO ont les leurs (reo_ajust.conf,
# reo_myreo.conf).
#
# Deposer ce fichier sur HDFS et le passer en 2e argument du driver :
#   MainDriverReo <env> hdfs:///.../reo_alim.conf      env = dev | int | hom | prd
#   bin/run_reo.sh covid <env> hdfs:///.../reo_alim.conf
#
# Chemins : racine par environnement (contextes Talend) + chemin relatif par table. Une table peut surcharger
# son chemin pour un environnement : dfin.bsy.<TABLE>.path_input.<env> / output_path.<env>.
# Les racines et les tables communes avec reo_ajust.conf (YEAR_MAPPING, LK_*, DIM_*, REF_DATA_TYPE_SV) ont les
# memes valeurs : reporter tout changement dans les fichiers concernes (controle par ConfFilesSpec).
# =====================================================================================================

dfin.bsy.reo {

  # --- Interrupteurs d'etapes : true par defaut (reomaker_check et myreo_plan_data_types toujours executes) --
  nrg_pci_map_trt            = true   # LUD_AJUST_REO_NRG_PCI_MAP_TO_SV_SPARK
  reomaker_to_sv_trt         = true   # MYREO_ORCHESTRATION_DATA_TO_SV -> MYREO_REO_RD_TO_SV
  myreo_calculation_trt      = true   # LUD_AJUST_REO_CALCULATION_SPARK
  myreo_conso_bv_trt         = true   # LUD_AJUST_REO_CONSO_TO_BV_SPARK
  myreo_gts_skipper_trt      = true   # REO_CONSO_ADD_GTS_SKIPPER_TO_BV_SPARK_MY_REO
  myreo_dc_conso_uv_trt      = true   # REO_CONSO_ADD_GTS_SKIPPER_ODS_TO_UV_SPARK_MY_REO
  myreo_archive_inactive_trt = true   # AJUST_REO_CONSO_TO_BV_SPARK_ARCH
  mssql_conso_delta_trt      = true   # LUD_EXP_SQLDB_CONSO_DATA_REO_FROM_UV_TO_MSSQL_STOCK (+ TRUNCATE_CONSO_REO_PROC_MSSQL)
  mssql_cube_trt             = true   # CUBE_PROC_MSSQL
  mssql_aju_import_trt       = true   # LUD_REO_AJU_FROM_MSSQL_TO_HDFS
  mssql_truncate_import_trt  = true   # LUD_REO_TRUNCATE_HDFS_AJUSTEMENT_TO_FACT_TABLE
  ajust_calculation_trt      = true   # LUD_REO_AJUST_CALCULATION_SPARK
  mssql_aju_export_trt       = true   # LUD_REO_EXP_AJU_ADD_GTS_SKIPPER_FROM_HDFS_TO_MSSQL
  mssql_send_to_fact_trt     = true   # LUD_REO_SEND_HDFS_AJUSTEMENT_TO_FACT
  ajust_to_depot_trt         = true   # LUD_REO_AJUST_ODS_TO_ARCHIVE

  # Alertes qualite non bloquantes (cles en double, montants hors du DECIMAL(17,12) de la conso Talend)
  dq_checks = true

  # Ecriture des 14 fichiers intermediaires de chaque ventilation (dossiers my_reo/aju/ventil et ajust/aju/ventil).
  # L'agregat ne les relit pas : false supprime seulement la trace.
  write_ventil_files = true

  # Nombre de fichiers par sortie Spark (surcharge possible : dfin.bsy.<TABLE>.output_partitions)
  output_partitions = 1

  # Parametres Spark SQL par environnement (memes valeurs que la chaine AJUST)
  spark_sql_conf {
    dev { "spark.sql.shuffle.partitions" = 20 }
    int { "spark.sql.shuffle.partitions" = 20 }
    hom { "spark.sql.shuffle.partitions" = 240 }
    prd { "spark.sql.shuffle.partitions" = 240 }
  }

  # --- SQL Server (contextes Talend cxnMSSQL_*) ---------------------------------------------------------
  # Pilote Microsoft mssql-jdbc. Les valeurs A_RENSEIGNER (serveur, compte) sont a reporter depuis les
  # contextes Talend dans le fichier depose sur HDFS : le depot Git est public. Le driver refuse de se
  # connecter tant qu'elles restent a A_RENSEIGNER.
  # Mot de passe (cxnMSSQL_Password) : jamais dans ce fichier. Alias dans un magasin Hadoop jceks
  # (hadoop credential create bsy.reo.mssql.password -provider jceks://hdfs/<env>/app/bsy_a2918/conf/reo_mssql.jceks),
  # ou a defaut variable d'environnement password_env du driver (spark.yarn.appMasterEnv.REO_MSSQL_PASSWORD).
  # url_params : instanceName du contexte Talend a ajouter si le port ne suffit pas (a valider avec le DBA).
  # Parite stricte avec Talend possible : url = "jdbc:jtds:sqlserver://..." et driver = "net.sourceforge.jtds.jdbc.Driver"
  # (jar jTDS a fournir).
  mssql {
    dev {
      server = "A_RENSEIGNER", port = 14001, database = "BSY_REO", schema = "dbo", login = "A_RENSEIGNER"
      url_params = "encrypt=true;trustServerCertificate=true;loginTimeout=60"
      password_alias = "bsy.reo.mssql.password"
      credential_provider_path = "jceks://hdfs/dev/app/bsy_a2918/conf/reo_mssql.jceks"
      password_env = "REO_MSSQL_PASSWORD"
    }
    int {
      server = "A_RENSEIGNER", port = 14001, database = "BSY_REO", schema = "dbo", login = "A_RENSEIGNER"
      url_params = "encrypt=true;trustServerCertificate=true;loginTimeout=60"
      password_alias = "bsy.reo.mssql.password"
      credential_provider_path = "jceks://hdfs/int/app/bsy_a2918/conf/reo_mssql.jceks"
      password_env = "REO_MSSQL_PASSWORD"
    }
    hom {
      server = "A_RENSEIGNER", port = 14001, database = "BSY_REO", schema = "dbo", login = "A_RENSEIGNER"
      url_params = "encrypt=true;trustServerCertificate=true;loginTimeout=60"
      password_alias = "bsy.reo.mssql.password"
      credential_provider_path = "jceks://hdfs/fhml/app/bsy_a2918/conf/reo_mssql.jceks"
      password_env = "REO_MSSQL_PASSWORD"
    }
    prd {
      server = "A_RENSEIGNER", port = 14001, database = "BSY_REO", schema = "dbo", login = "A_RENSEIGNER"
      url_params = "encrypt=true;trustServerCertificate=true;loginTimeout=60"
      password_alias = "bsy.reo.mssql.password"
      credential_provider_path = "jceks://hdfs/prd/app/bsy_a2918/conf/reo_mssql.jceks"
      password_env = "REO_MSSQL_PASSWORD"
    }
  }
  # Code retour non nul ou message d'une procedure p_api_* : WARN = alerte et suite (Talend n'en tenait pas
  # compte), FAIL = arret de la chaine. A fixer avec le DBA selon le contrat des procedures.
  mssql_on_proc_error = "WARN"
  # Delai maximal d'une requete ou d'une procedure, en secondes (0 = aucun, comme Talend ; a fixer, en
  # particulier pour p_api_launch_Delta_process).
  mssql_query_timeout = 0
  mssql_insert_partitions = 1           # connexions simultanees des insertions
  mssql_conso_delta_batch_size = 10000  # tDBOutput_1 de LUD_EXP_SQLDB_CONSO_DATA_REO_FROM_UV_TO_MSSQL_STOCK
  mssql_import_batch_size = 50000       # tMSSqlOutput_3 de LUD_REO_EXP_AJU_ADD_GTS_SKIPPER_FROM_HDFS_TO_MSSQL
  # Requete d'extraction des ajustements (Talend Query_aju = select * from dbo.ajustment_reo, lu par position) :
  # par defaut, les 20 colonnes du schema Talend nommees explicitement.
  # mssql_aju_query = "SELECT ... FROM [dbo].[ajustment_reo]"

  # --- Racines par environnement (contextes Talend des jobs COVID) -------------------------------------
  roots {
    dev {
      sv_reo     = "/dev/srv/bsy_a2918/srv_bsy_a2918_basycout/sv_reo"            # BSY_ROOT_SV_REO
      erk_sv     = "/dev/srv/bsy_a2918/srv_bsy_a2918_basycout/erk_a2832"         # ERK_SV_ROOT_PATH_OUT
      erk_sv_reo = "/dev/srv/bsy_a2918/srv_bsy_a2918_basycout/sv_reo/a2832_erk"  # ERK_SV_REO_ROOT_PATH_OUT (nommage DEV inverse)
      bv_reo     = "/dev/app/bsy_a2918/app_bsy_a2918_basycout/bv_reo"            # BSY_ROOT_BV_REO
      bv         = "/dev/app/bsy_a2918/app_bsy_a2918_basycout/bv"                # BSY_ROOT_BV
      wp_reo     = "/dev/app/bsy_a2918/wp_reo"                                   # BSY_WP_ROOT_PATH_OUT
      wp         = "/dev/app/bsy_a2918/wp"                                       # BSY_ROOT_WP / BSY_WP_ROOT_PATH_IN
      uv_reo     = "/dev/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo"              # BSY_UV_ROOT_PATH_OUT / BSY_ROOT_UV
      ere_uv     = "/dev/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo/a2309_ere"    # ERE_UV_ROOT_PATH_OUT (nommage DEV inverse)
      erk_uv     = "/dev/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo/a2832_erk"    # ERK_UV_ROOT_PATH_OUT (nommage DEV inverse)
      gzh_uv     = "/dev/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo/a2835_gzh"    # GZH_UV_ROOT_PATH_OUT (nommage DEV inverse)
      usg_uv     = "/dev/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo/usg"          # USG_UV_ROOT_PATH_OUT
    }
    int {
      sv_reo     = "/int/srv/bsy_a2918/srv_bsy_a2918_basycout/sv_reo"
      erk_sv     = "/int/srv/bsy_a2918/srv_bsy_a2918_basycout/erk_a2832"
      erk_sv_reo = "/int/srv/bsy_a2918/srv_bsy_a2918_basycout/sv_reo/erk_a2832"  # a verifier : contexte INT non lu
      bv_reo     = "/int/app/bsy_a2918/app_bsy_a2918_basycout/bv_reo"
      bv         = "/int/app/bsy_a2918/app_bsy_a2918_basycout/bv"
      wp_reo     = "/int/app/bsy_a2918/wp_reo"
      wp         = "/int/app/bsy_a2918/wp"
      uv_reo     = "/int/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo"
      ere_uv     = "/int/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo/ere_a2309"
      erk_uv     = "/int/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo/erk_a2832"
      gzh_uv     = "/int/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo/gzh_a2835"
      usg_uv     = "/int/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo/usg"
    }
    hom {
      sv_reo     = "/fhml/srv/bsy_a2918/srv_bsy_a2918_basycout/sv_reo"
      erk_sv     = "/fhml/srv/bsy_a2918/srv_bsy_a2918_basycout/erk_a2832"
      erk_sv_reo = "/fhml/srv/bsy_a2918/srv_bsy_a2918_basycout/sv_reo/erk_a2832"
      bv_reo     = "/fhml/app/bsy_a2918/app_bsy_a2918_basycout/bv_reo"
      bv         = "/fhml/app/bsy_a2918/app_bsy_a2918_basycout/bv"
      wp_reo     = "/fhml/app/bsy_a2918/wp_reo"
      wp         = "/fhml/app/bsy_a2918/wp_reo"                                  # Talend HOM : BSY_ROOT_WP = wp_reo
      uv_reo     = "/fhml/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo"
      ere_uv     = "/fhml/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo/ere_a2309"
      erk_uv     = "/fhml/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo/erk_a2832"
      gzh_uv     = "/fhml/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo/gzh_a2835"
      usg_uv     = "/fhml/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo/usg"
    }
    prd {
      sv_reo     = "/prd/srv/bsy_a2918/srv_bsy_a2918_basycout/sv_reo"
      erk_sv     = "/prd/srv/bsy_a2918/srv_bsy_a2918_basycout/erk_a2832"
      erk_sv_reo = "/prd/srv/bsy_a2918/srv_bsy_a2918_basycout/sv_reo/erk_a2832"
      bv_reo     = "/prd/app/bsy_a2918/app_bsy_a2918_basycout/bv_reo"
      bv         = "/prd/app/bsy_a2918/app_bsy_a2918_basycout/bv"
      wp_reo     = "/prd/app/bsy_a2918/wp_reo"
      wp         = "/prd/app/bsy_a2918/wp"
      uv_reo     = "/prd/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo"
      ere_uv     = "/prd/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo/ere_a2309"
      erk_uv     = "/prd/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo/erk_a2832"
      gzh_uv     = "/prd/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo/gzh_a2835"
      usg_uv     = "/prd/uv/bsy_a2918/uv_bsy_a2918_basycout/uv_reo/usg"
    }
  }

  # --- Racines que la chaine ne doit jamais ecraser : referentiels d'autres chaines, extraction REOMAKER et
  #     parametres (la chaine ecrit sous erk_sv_reo/ajust/mp_nrg_pci, pas dans le referentiel erk_sv) ---------
  protected_roots {
    dev = [${dfin.bsy.reo.roots.dev.ere_uv}, ${dfin.bsy.reo.roots.dev.erk_uv}, ${dfin.bsy.reo.roots.dev.gzh_uv},
           ${dfin.bsy.reo.roots.dev.usg_uv}, ${dfin.bsy.reo.roots.dev.erk_sv},
           ${dfin.bsy.reo.roots.dev.wp}"/ods/map_gts_type_ca", ${dfin.bsy.reo.roots.dev.wp}"/ods/map_gts_skipper",
           ${dfin.bsy.reo.roots.dev.wp}"/ods/mvt_map_ca_nrg",
           ${dfin.bsy.reo.roots.dev.bv_reo}"/reomaker", ${dfin.bsy.reo.roots.dev.wp_reo}"/params"]
    int = [${dfin.bsy.reo.roots.int.ere_uv}, ${dfin.bsy.reo.roots.int.erk_uv}, ${dfin.bsy.reo.roots.int.gzh_uv},
           ${dfin.bsy.reo.roots.int.usg_uv}, ${dfin.bsy.reo.roots.int.erk_sv},
           ${dfin.bsy.reo.roots.int.wp}"/ods/map_gts_type_ca", ${dfin.bsy.reo.roots.int.wp}"/ods/map_gts_skipper",
           ${dfin.bsy.reo.roots.int.wp}"/ods/mvt_map_ca_nrg",
           ${dfin.bsy.reo.roots.int.bv_reo}"/reomaker", ${dfin.bsy.reo.roots.int.wp_reo}"/params"]
    hom = [${dfin.bsy.reo.roots.hom.ere_uv}, ${dfin.bsy.reo.roots.hom.erk_uv}, ${dfin.bsy.reo.roots.hom.gzh_uv},
           ${dfin.bsy.reo.roots.hom.usg_uv}, ${dfin.bsy.reo.roots.hom.erk_sv},
           ${dfin.bsy.reo.roots.hom.wp}"/ods/map_gts_type_ca", ${dfin.bsy.reo.roots.hom.wp}"/ods/map_gts_skipper",
           ${dfin.bsy.reo.roots.hom.wp}"/ods/mvt_map_ca_nrg",
           ${dfin.bsy.reo.roots.hom.bv_reo}"/reomaker", ${dfin.bsy.reo.roots.hom.wp_reo}"/params"]
    prd = [${dfin.bsy.reo.roots.prd.ere_uv}, ${dfin.bsy.reo.roots.prd.erk_uv}, ${dfin.bsy.reo.roots.prd.gzh_uv},
           ${dfin.bsy.reo.roots.prd.usg_uv}, ${dfin.bsy.reo.roots.prd.erk_sv},
           ${dfin.bsy.reo.roots.prd.wp}"/ods/map_gts_type_ca", ${dfin.bsy.reo.roots.prd.wp}"/ods/map_gts_skipper",
           ${dfin.bsy.reo.roots.prd.wp}"/ods/mvt_map_ca_nrg",
           ${dfin.bsy.reo.roots.prd.bv_reo}"/reomaker", ${dfin.bsy.reo.roots.prd.wp_reo}"/params"]
  }
}

dfin.bsy {

  # ===================================================================================================
  # Table NRG -> PCI (LUD_AJUST_REO_NRG_PCI_MAP_TO_SV_SPARK) : CSV ';' sans en-tete, sorties en dossiers Spark
  # ===================================================================================================
  COVID_RUBRIQUE   { input_root = "erk_uv", input_rel = "/rubrique/rubrique.csv", input_delimiter = ";" }
  LK_PCI           { input_root = "ere_uv", input_rel = "/pci/pci.csv", input_delimiter = "|" }
  MP_NRG_PCI_EQUAL {
    input_root  = "erk_sv_reo", input_rel  = "/ajust/mp_nrg_pci/equal"
    output_root = "erk_sv_reo", output_rel = "/ajust/mp_nrg_pci/equal"
    input_delimiter = ";", output_format = "CSV", output_delimiter = ";"
  }
  MP_NRG_PCI_DIFF {
    input_root  = "erk_sv_reo", input_rel  = "/ajust/mp_nrg_pci/diff"
    output_root = "erk_sv_reo", output_rel = "/ajust/mp_nrg_pci/diff"
    input_delimiter = ";", output_format = "CSV", output_delimiter = ";"
  }
  MP_NRG_PCI_ODS_DIFF  { output_root = "wp_reo", output_rel = "/ods/mp_nrg_pci/diff/diff", output_format = "CSV", output_delimiter = ";" }
  MP_NRG_PCI_ODS_DIFF9 { output_root = "wp_reo", output_rel = "/ods/mp_nrg_pci/diff/diff9", output_format = "CSV", output_delimiter = ";" }
  MP_NRG_PCI_ODS_ALL   { input_root = "wp_reo", input_rel = "/ods/mp_nrg_pci/diff/*", input_delimiter = ";" }

  # ===================================================================================================
  # Bloc MyREO : pilotage, extraction REOMAKER et fichier SV (UTF-8, ';')
  # ===================================================================================================
  REOMAKER_ACTIVE  { input_root = "wp_reo", input_rel = "/params/reomaker/reomaker_active.csv", input_delimiter = ";", input_header = false }
  REOMAKER_IN      { input_root = "bv_reo", input_rel = "/reomaker/reomaker.csv", input_delimiter = ";", input_header = true }
  REF_DATA_TYPE_SV { input_root = "erk_sv", input_rel = "/ajust/dtype", input_delimiter = ";" }
  REOMAKER_SV {                                    # meme fichier que MYREO_SV de reo_myreo.conf (collision Talend)
    input_root  = "sv_reo", input_rel  = "/my_reo/Extract_Ajus_Outil_REO_pour_BSY_REO.csv"
    output_root = "sv_reo", output_rel = "/my_reo/Extract_Ajus_Outil_REO_pour_BSY_REO.csv"
    input_delimiter = ";"
  }

  # --- Parametres des ventilations (communs aux deux jobs de calcul) ---
  YEAR_MAPPING {
    input_root = "wp_reo", input_rel = "/params/super_phase/year_mapping.txt"
    input_delimiter = ";", input_header = true                                          # HEADER = 1
  }
  PARAM_M_MTD     { input_root = "wp_reo", input_rel = "/params/aju/m_mtd.csv", input_delimiter = ";" }
  PARAM_M_QTD     { input_root = "wp_reo", input_rel = "/params/aju/m_qtd.csv", input_delimiter = ";" }
  PARAM_M_FQ      { input_root = "wp_reo", input_rel = "/params/aju/m_fq.csv", input_delimiter = ";" }
  PARAM_M_FY      { input_root = "wp_reo", input_rel = "/params/aju/m_fy.csv", input_delimiter = ";" }
  ETP_MTD_GD1_GD2 { input_root = "wp_reo", input_rel = "/params/etp/mapping_mtd_gd1_gd2/mapping_mtd_gd1_gd2.csv", input_delimiter = ";" }
  ETP_GD2_MTD_QTD { input_root = "wp_reo", input_rel = "/params/etp/mapping_gd2_mtd_qtd/mapping_gd2_mtd_qtd.csv", input_delimiter = ";" }
  ETP_GD2_MTD_YTD { input_root = "wp_reo", input_rel = "/params/etp/mapping_gd2_mtd_ytd/mapping_gd2_mtd_ytd.csv", input_delimiter = ";" }
  ETP_GD2_QTD_FQ  { input_root = "wp_reo", input_rel = "/params/etp/mapping_gd2_qtd_fq/mapping_gd2_qtd_fq.csv", input_delimiter = ";" }
  ETP_GD2_YTD_FY  { input_root = "wp_reo", input_rel = "/params/etp/mapping_gd2_ytd_fy/mapping_gd2_ytd_fy.csv", input_delimiter = ";" }

  # --- Ventilation MyREO (LUD_AJUST_REO_CALCULATION_SPARK) ---
  MYREO_VENTIL  { output_root = "wp_reo", output_rel = "/my_reo/aju/ventil" }           # 14 fichiers <nom>.csv
  MYREO_AJU_AGG {
    input_root  = "wp_reo", input_rel  = "/my_reo/aju/agg/aju_agg.csv"
    output_root = "wp_reo", output_rel = "/my_reo/aju/agg/aju_agg.csv"
    input_delimiter = ";"
  }

  # --- Conso, enrichissement GTS et archive MyREO (Parquet non compresse, + /<dtype>) ---
  MYREO_CONSO_WP {
    input_root  = "wp_reo", input_rel  = "/my_reo/conso_reo"
    output_root = "wp_reo", output_rel = "/my_reo/conso_reo"
    output_format = "PARQUET", output_compression = "uncompressed"
  }
  MYREO_CONSO_ARCH {
    output_root = "bv", output_rel = "/conso_bigms/my_reo"
    output_format = "PARQUET", output_compression = "uncompressed"
    # Talend HOM : BSY_ROOT_BV = bv_reo
    output_path.hom = "/fhml/app/bsy_a2918/app_bsy_a2918_basycout/bv_reo/conso_bigms/my_reo"
  }
  MYREO_CONSO_SKIPPER {
    input_root  = "wp_reo", input_rel  = "/my_reo/conso_skipper"
    output_root = "wp_reo", output_rel = "/my_reo/conso_skipper"
    output_format = "PARQUET", output_compression = "uncompressed"
  }
  LK_GTS_TYPE_CA { input_root = "wp", input_rel = "/ods/map_gts_type_ca/map_gts_type_ca.csv", input_delimiter = ";", input_trim = true }
  LK_GTS_SKIPPER { input_root = "wp", input_rel = "/ods/map_gts_skipper/map_gts_skipper.csv", input_delimiter = ";", input_trim = true }
  LK_CA_SNRG     { input_root = "wp", input_rel = "/ods/mvt_map_ca_nrg/ca/*", input_delimiter = ";", input_trim = true }

  # --- Fait UV MyREO : referentiels TRIMALL sauf la classification (lus aussi par le fait AJUST) ---
  DIM_SUPER_PHASE       { input_root = "usg_uv", input_rel = "/synthese_cout_superphase/uv_data_synthese_cout_superphase.txt", input_trim = true }
  DIM_PHASE             { input_root = "usg_uv", input_rel = "/synthese_cout_phase/uv_data_synthese_cout_phase.txt", input_trim = true }
  DIM_PCI               { input_root = "ere_uv", input_rel = "/pci", input_delimiter = "|", input_trim = true }
  DIM_PERIODE           { input_root = "usg_uv", input_rel = "/synthese_cout_periode/uv_data_synthese_cout_periode.txt", input_trim = true }
  DIM_ACTIVITE          { input_root = "erk_uv", input_rel = "/activite", input_trim = true }
  DIM_PYRAMIDE_BUDG     { input_root = "erk_uv", input_rel = "/res07", input_delimiter = "|", input_trim = true }
  DIM_CUMUL             { input_root = "usg_uv", input_rel = "/synthese_cout_cumul/uv_data_synthese_cout_cumul.txt", input_trim = true }
  COVID_DIM_SUPERVISION { input_root = "gzh_uv", input_rel = "/ref/supervision/supervision.csv", input_trim = true }
  COVID_DIM_CONVERSION  { input_root = "gzh_uv", input_rel = "/ref/conversion/conversion.csv", input_trim = true }
  DIM_DATA_TYPE         { input_root = "erk_uv", input_rel = "/ajust/dtype/dtype.csv", input_trim = true }
