  DIM_CLASSIFICATION    { input_root = "erk_uv", input_rel = "/spe_imm/ref_classification/ref_classification.csv" }

  MYREO_DC_CONSO_UV {                              # fichier unique, relu par l'export vers dc_conso_delta
    input_root  = "uv_reo", input_rel  = "/dc_conso/my_reo/conso_reo.csv"
    output_root = "uv_reo", output_rel = "/dc_conso/my_reo/conso_reo.csv"
    input_delimiter = ";"
  }

  # ===================================================================================================
  # Bloc des ajustements SQL Server : fichiers uniques ';' UTF-8 sans en-tete
  # ===================================================================================================
  AJUST_AJU_SQL {                                  # REP_AJU (19 colonnes, format detail)
    input_root  = "wp_reo", input_rel  = "/ajust/aju/sql/aju.csv"
    output_root = "wp_reo", output_rel = "/ajust/aju/sql/aju.csv"
    input_delimiter = ";"
  }
  AJUST_VENTIL  { output_root = "wp_reo", output_rel = "/ajust/aju/ventil" }            # 14 fichiers <nom>.csv
  AJUST_AJU_AGG {                                  # 19 colonnes, format agrege
    input_root  = "wp_reo", input_rel  = "/ajust/aju/agg/aju_agg.csv"
    output_root = "wp_reo", output_rel = "/ajust/aju/agg/aju_agg.csv"
    input_delimiter = ";"
  }
  # Depot de la chaine AJUST (lu par son dispatch puis supprime par elle). Ecrit en UTF-8 comme Talend.
  AJUST_DEPOT_SQL { output_root = "wp_reo", output_rel = "/ajust/aju/archive/sql/sql_reo.csv" }
  AJUST_DEPOT_AGG { output_root = "wp_reo", output_rel = "/ajust/aju/archive/agg/agg_reo.csv" }
}
