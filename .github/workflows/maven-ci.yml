# CI du projet BSY_REO : controle, build + tests, publication JFrog, tag Git sur main / master.
# Les workflows reutilisables viennent du depot generique DTUTransverse/reusable-github-actions.
#
# Prerequis du depot : secret JF_ACCESS_TOKEN ; variables JF_URL, JF_MVN_VIRTUAL, JF_MVN_RELEASES, JF_MVN_SNAPSHOTS.

name: Scala CI with Jfrog

on:
  workflow_dispatch:
    inputs:
      branch_name:
        type: string
        description: "Branche a construire (vide : la branche selectionnee ci-dessus)"
      skip_tests:
        type: boolean
        default: false
        description: "Ne pas lancer les tests unitaires"

env:
  JFROG_CLI_RELEASES_REPO: setup-jfrog-cli-server/jfrog-releases

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }} @ ${{ inputs.branch_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  calculate-project-version:
    uses: DTUTransverse/reusable-github-actions/.github/workflows/project-version-generator.yml@main
    with:
      # Release sur main / master, snapshot ailleurs
      is-snapshot: ${{ !contains(fromJSON('["main", "master"]'), inputs.branch_name || github.ref_name) }}
      branch_name: ${{ inputs.branch_name }}

  init-control-project:
    uses: DTUTransverse/reusable-github-actions/.github/workflows/init-controls-project-scala.yml@main
    needs: [ calculate-project-version ]
    with:
      is-snapshot: ${{ !contains(fromJSON('["main", "master"]'), inputs.branch_name || github.ref_name) }}
      branch_name: ${{ inputs.branch_name }}
    secrets:
      jf-secret: ${{ secrets.JF_ACCESS_TOKEN }}

  #  sonar-scan:
  #    uses: DTUTransverse/reusable-github-actions/.github/workflows/sonar-scan.yml@main
  #    needs: [ calculate-project-version, build-project ]
  #    with:
  #      project-version: ${{ needs.calculate-project-version.outputs.tag-version }}
  #      branch_name: ${{ inputs.branch_name }}
  #    secrets:
  #      SONAR_SECRET: ${{ secrets.SONAR_SECRET }}

  build-project:
    uses: DTUTransverse/reusable-github-actions/.github/workflows/build-project-scala.yml@main
    needs: [ calculate-project-version, init-control-project ]
    with:
      skip-tests: ${{ inputs.skip_tests }}
      is-snapshot: ${{ !contains(fromJSON('["main", "master"]'), inputs.branch_name || github.ref_name) }}
      branch_name: ${{ inputs.branch_name }}
    secrets:
      jf-secret: ${{ secrets.JF_ACCESS_TOKEN }}

  # Les trois drivers lances par bin/run_reo.sh doivent etre dans le jar construit
  # (artefact build-artifact publie par build-project-scala.yml)
  check-jar:
    runs-on: [ self-hosted, linux ]
    timeout-minutes: 10
    needs: [ build-project ]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifact
          path: target/
      - name: Check jar content
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=()
          for j in target/*.jar; do
            case "$j" in *-sources.jar|*-javadoc.jar|*-tests.jar|target/original-*) ;; *) jars+=("$j") ;; esac
          done
          (( ${#jars[@]} )) || { echo "::error::Aucun jar dans build-artifact"; exit 1; }
          content=$(for j in "${jars[@]}"; do unzip -Z1 "$j"; done)
          ko=0
          for c in MainDriverAjustReo MainDriverMyReo MainDriverReo; do
            entry="com/bsy/datalake/reo/job/$c.class"
            if grep -qxF "$entry" <<< "$content"; then echo "OK  $entry"; else echo "::error::Classe absente du jar : $entry"; ko=1; fi
          done
          exit $ko

  create-github-tag:
    uses: DTUTransverse/reusable-github-actions/.github/workflows/github-tag-creator.yml@main
    needs: [ check-jar, calculate-project-version ]
    if: ${{ contains(fromJSON('["main", "master"]'), inputs.branch_name || github.ref_name) }}
    permissions:
      contents: write
    with:
      tag-version: ${{ needs.calculate-project-version.outputs.tag-version }}
